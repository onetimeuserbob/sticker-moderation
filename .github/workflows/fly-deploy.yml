name: Deploy to fly.io

on:
  # Auto-deploy on every push to main.
  push:
    branches: [main]
  # Allow manual "Run workflow" from the Actions tab.
  workflow_dispatch:

# Cancel any in-flight deploy if a newer commit lands — never have two
# deploys racing each other.
concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to fly.io
    runs-on: ubuntu-latest
    # Skip deploys if the only changes are docs/CI yaml. Saves ~2min per
    # README tweak. Code/Dockerfile/fly.toml changes always deploy.
    if: |
      !contains(github.event.head_commit.message, '[skip deploy]')
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --app sticker-moderation-bot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
