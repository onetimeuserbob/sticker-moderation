# fly.io app configuration for the Sticker Pad review bot.
#
# The bot itself uses Telegram long-polling (outbound HTTPS only). We
# bind a tiny health-check HTTP server on $PORT alongside it so fly's
# deploy probes succeed. The machine stays running 24/7 (no auto-stop)
# because long-poll bots don't generate inbound traffic that would keep
# them awake.
#
# After changes here:
#   fly deploy

app = 'sticker-moderation-bot'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PYTHONUNBUFFERED = "1"
  PORT = "8080"

[[mounts]]
  source = 'review_bot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[deploy]
  strategy = 'immediate'
