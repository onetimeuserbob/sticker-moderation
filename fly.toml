# fly.toml app configuration file generated for sticker-moderation-bot on 2026-05-05T22:03:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sticker-moderation-bot'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  PYTHONUNBUFFERED = '1'

[[mounts]]
  source = 'review_bot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
