# fly.io app configuration for the Sticker Pad review bot.
#
# This bot is a long-poll Telegram client — no inbound HTTP, no public
# ports, just one always-on process. We run a single shared VM with a
# persistent volume mounted at /data for the rules store, allowlist,
# and the Telegram thumbnail cache.
#
# After `fly launch` (or `fly deploy`):
#   fly secrets set ANTHROPIC_API_KEY=...   \
#                   REVIEW_BOT_TOKEN=...    \
#                   TELEGRAM_BOT_TOKEN=...  \
#                   OWNER_USER_ID=2580397   \
#                   SOURCE_BOT_USERNAME=sticker_bot
#   fly volumes create review_bot_data --size 1 --region ams
#   fly deploy

app = "sticker-moderation-bot"   # change to your unique app name in fly launch
primary_region = "ams"           # any region works; pick one near you

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  PORT = "8080"

[[mounts]]
  source = "review_bot_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

# The bot itself uses Telegram long-polling (outbound only). We also
# bind a tiny health-check HTTP server on $PORT so fly's deploy probes
# get a 200, and the machine stays running 24/7 (no auto-stop).
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[deploy]
  strategy = "immediate"
